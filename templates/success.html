<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Successfully</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .checkmark {
            font-size: 80px;
            color: #38ef7d;
            animation: checkmark 0.8s ease-in-out;
        }

        @keyframes checkmark {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin: 20px 0 10px 0;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .network-name {
            color: #11998e;
            font-weight: bold;
            margin: 20px 0;
            font-size: 18px;
        }

        .redirect-message {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>Successfully Connected!</h1>
        <p>You are now connected to the network</p>
        <div class="network-name">{{SSID}}</div>
        <p class="redirect-message">You can now browse the internet freely.</p>
    </div>

    <script>
        // Redirect to a real website after 3 seconds
        setTimeout(() => {
            window.location.href = 'https://www.google.com';
        }, 3000);
    </script>
</body>
</html>
