; PlatformIO Project Configuration File
;
; ESP32 DeAuth Tool
; For use with PlatformIO IDE

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build flags for ESP32 WiFi features
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Monitor configuration
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Library dependencies
lib_deps =
    ; All built-in ESP32 libraries (WiFi, WebServer, SPIFFS, etc.)
    ; are included by default with the ESP32 core

; Upload configuration
upload_speed = 921600

; Filesystem configuration for SPIFFS
board_build.filesystem = spiffs
